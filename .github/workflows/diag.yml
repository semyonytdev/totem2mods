name: Диагностика
on:
  push:
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle genSources --no-daemon
        working-directory: totemcuk
      - name: Собрать нужное
        run: |
          mkdir -p /tmp/src /tmp/jar /tmp/out
          for j in $(find / -name '*sources.jar' -path '*inecraft*' -size +5M 2>/dev/null | head -5); do unzip -qo "$j" -d /tmp/src || true; done
          find / -name 'minecraft*.jar' -not -name '*sources*' -size +10M 2>/dev/null | head -10 | tee /tmp/out/_jars.txt
          for j in $(find / -name 'minecraft*.jar' -not -name '*sources*' -size +10M 2>/dev/null | head -5); do unzip -qo "$j" 'data/minecraft/trim_pattern/*' 'data/minecraft/recipe/*smithing*' 'data/minecraft/recipe/*trim*' 'data/minecraft/tags/item/trim*' 'data/minecraft/loot_table/blocks/sculk*' 'data/minecraft/loot_table/chests/ancient_city*' 'assets/minecraft/atlases/*' 'assets/minecraft/textures/block/sculk*' 'assets/minecraft/textures/entity/equipment/humanoid/*' 'assets/minecraft/textures/trims/*' 'assets/minecraft/items/*smithing*' 'assets/minecraft/items/sculk*' 'assets/minecraft/models/item/*smithing*' 'assets/minecraft/blockstates/sculk*' 'assets/minecraft/models/block/sculk*' 'assets/minecraft/equipment/*' 'assets/minecraft/lang/ru_ru.json' -d /tmp/jar 2>/dev/null || true; done
          cp -r /tmp/jar/data /tmp/out/data 2>/dev/null || true
          cp -r /tmp/jar/assets /tmp/out/assets 2>/dev/null || true
          for p in SmithingTrimRecipe TrimPattern TrimMaterial ArmorTrim SmithingTemplateItem Items DropExperienceBlock SculkBlock SculkShriekerBlock Blocks BossEvent ServerBossEvent Warden EntityType DefaultAttributes; do
            find /tmp/src -name "$p.java" -exec cp --backup=numbered {} /tmp/out/ \;
          done
          cp /tmp/src/net/minecraft/world/entity/monster/warden/Warden.java /tmp/out/ 2>/dev/null || true
          find /tmp/jar -type f | head -200 > /tmp/out/_files.txt
          du -sh /tmp/out
      - name: Запушить
        run: |
          cd /tmp/out
          git init -q -b diag-src
          git config user.email a@b.c; git config user.name diag
          git add -A; git commit -qm diag
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git diag-src

name: Диагностика
on:
  push:
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle genSources --no-daemon
        working-directory: totemcuk
      - name: Собрать нужные исходники
        run: |
          mkdir -p /tmp/out
          mkdir -p /tmp/src
          find / -name '*sources.jar' -path '*inecraft*' 2>/dev/null | head -20
          J=$(find / -name '*sources.jar' -path '*inecraft*' -size +5M 2>/dev/null | head -5)
          echo "$J"
          for j in $J; do unzip -qo "$j" -d /tmp/src || true; done
          for p in CapeLayer PlayerSkin PlayerInfo AbstractClientPlayer AvatarRenderer AvatarRenderState ClientAsset; do
            find /tmp/src -name "$p.java" -exec cp --backup=numbered {} /tmp/out/ \;
          done
          grep -rl "showCape" /tmp/src | head -20 > /tmp/out/_showCape_files.txt || true
          ls -la /tmp/out
      - name: Запушить в ветку diag-src
        run: |
          cd /tmp/out
          git init -q -b diag-src
          git config user.email a@b.c; git config user.name diag
          git add -A; git commit -qm diag
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git diag-src

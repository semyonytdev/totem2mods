name: Собрать моды
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  totemcuk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
        working-directory: totemcuk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: totemcuk-${{ github.run_number }}
          name: totemcuk (сборка ${{ github.run_number }})
          files: totemcuk/build/libs/totemcuk-1.0.0.jar
